<app-margins>
  <!-- Header -->
  <app-page-header [title]="title" />
  <!-- Search, filter, and Add new task -->
  <div class="flex flex-row justify-between items-center mt-6">
    <app-search-bar [searchBarPlaceholder]="searchBarPlaceholder" />
    <button
      class="flex flex-row items-center gap-3 bg-[#771a47] text-[#ffffff] py-3 px-5 rounded-full text-lg font-custom cursor-pointer hover:bg-[#981c58]"
      (click)="openModal()"
    >
      <app-icons [icon]="'add'"></app-icons>
      <span>Add new task</span>
    </button>
  </div>
  <!-- Add new task modal -->
  @if (isModalOpen()) {
    <app-add-task (closed)="closeModal()"></app-add-task>
  }
</app-margins>
