<div
  class="flex flex-row w-5/6 gap-10 rounded-[15px] border-1 border-gray-200 bg-white p-6"
  (click)="onCardClick()"
>
  <input type="checkbox" class="h-6 w-6" />
  <div class="flex flex-col gap-2">
    <!-- Title -->
    <h3 class="text-xl font-medium font-custom text-gray-900">{{ task()?.title }}</h3>
    <!-- Description -->
    @if (task()?.description) {
      <p class="text-gray-700 font-custom text-base">{{ task()?.description }}</p>
    }
    <!-- Bottom badges -->
    <div class="flex flex-row gap-15 font-custom text-base">
      <!-- Priority -->
      <div class="flex flex-row gap-2 w-40">
        <app-icons [icon]="'priority'" [class]="activePriorityIconStyles()"></app-icons>
        <p [class]="activePriorityStyles()">{{ task()?.priority }}</p>
      </div>

      <!-- Calendar -->
      <div class="flex flex-row gap-2">
        <app-icons [icon]="'calendar'" class="text-[#898989]"></app-icons>
        <p class="text-[#898989]">{{ task()?.dueDate | date: 'd MMM y' }}</p>
      </div>
    </div>
  </div>
</div>
