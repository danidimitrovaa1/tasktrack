<invisible-backdrop (click)="closed.emit()" (click)="onSubmit($event)"></invisible-backdrop>
<form
  name="new_task_form"
  (submit)="onSubmit($event)"
  class="relative z-20 flex flex-row mt-6 w-3/5 gap-6 rounded-[15px] border border-gray-300 bg-white p-8 shadow-[0_0_20px_rgba(0,0,0,0.12)] font-custom items-start"
>
  <!-- Left: Checkbox -->
  <input type="checkbox" class="h-6 w-6 rounded border-1 border-gray-300" />
  <!-- Right: Rest of the elements -->
  <div class="w-full">
    <!-- Text input for task title -->
    <textarea
      required
      rows="3"
      placeholder="What needs doing today?"
      class="field-sizing-content min-h-[2rem] max-h-[250px] w-full resize-none border-none bg-transparent p-0 text-2xl outline-none placeholder:text-[#888888] focus:ring-0"
      (input)="onTitleInput($event)"
      [value]="taskTitle()"
    ></textarea>

    <!-- Text input for description -->
    <textarea
      rows="3"
      placeholder="Description"
      class="field-sizing-content min-h-[2rem] max-h-[350px] w-full resize-none border-none bg-transparent items-center mt-[15px] p-0 text-base text-gray-700 outline-none placeholder:text-[#888888] placeholder:pl-[2px] focus:ring-0"
      (input)="onDescriptionInput($event)"
      [value]="taskDescription()"
    ></textarea>

    <div class="flex flex-row items-center justify-between mt-2">
      <div class="relative flex flex-row gap-5 items-center">
        <!-- Priority button and dropdown -->
        <app-dropdown-menu
          [buttonTitle]="buttonTitle"
          [options]="priorityDropdownOptions"
          [icon]="icon"
          [selectedOption]="taskPriority()"
          (selectedOptionChange)="onPrioritySelect($event)"
          (prioritySelected)="onPrioritySelect($event)"
          class="w-[180px] shrink-0"
        ></app-dropdown-menu>
        <!-- Due date picker -->
        <app-due-date
          [datePickerButtonTitle]="datePickerButtonTitle"
          [(selectedDate)]="taskDueDate"
          [selectedDate]="taskDueDate()"
          (dateSelected)="taskDueDate.set($event)"
        ></app-due-date>
      </div>
      <div class="flex flex-row gap-4 items-center">
        <app-btn-cancel (click)="onCancelClick()" class="items-center"></app-btn-cancel>
        <app-btn-create></app-btn-create>
      </div>
    </div>
  </div>
</form>
@if (isConfirmDialogOpen()) {
  <confirmation-dialog
    (confirm)="onConfirmClick()"
    (discard)="onDiscardClick()"
    [dialogTitle]="dialogTitle"
    [dialogDescription]="dialogDescription"
    [discardButtonTag]="discardButtonTag"
    [confirmButtonTag]="confirmButtonTag"
  ></confirmation-dialog>
}
